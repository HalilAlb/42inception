# WordPress vhost. HTTPS-only, FastCGI to the wordpress container.
# No plain :80 listener — the subject wants 443 to be the *only* ingress.

server {
    # nginx 1.22 (Debian bookworm) doesn't have the standalone `http2 on;`
    # directive — that's a 1.25.1+ feature. Use the legacy combined form
    # on the listen directive instead.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;

    server_name malbayra.42.fr;

    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Subject: TLSv1.2 and TLSv1.3 *only*. Everything else must be refused.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reasonable security headers for a self-signed dev site. HSTS is left
    # off on purpose — pinning a non-trusted cert would brick browsers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    root        /var/www/html;
    index       index.php index.html;

    client_max_body_size 64M;

    # Static assets, then fall through to WordPress's front controller.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Hand PHP off to php-fpm in the wordpress container.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass            wordpress:9000;
        fastcgi_index           index.php;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param           PATH_INFO        $fastcgi_path_info;

        fastcgi_read_timeout    120s;
    }

    # Block hidden files / WP internals that should never leave the host.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(?:wp-config\.php|readme\.html|license\.txt) { deny all; }
}
