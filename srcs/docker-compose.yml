# Inception — stack orchestration (mandatory part only).
#
# Conventions (also enforced by the subject):
#   * Image and service share the same name. Every image is tagged `:42`
#     so we never accidentally pull `latest` from Docker Hub. The
#     `pull_policy: never` on each service makes that guarantee load-
#     bearing: compose refuses to pull from a registry and builds the
#     image locally instead (because every service has a `build:` field).
#   * The only ingress is nginx:443.
#   * The two required volumes (db_data, wp_files) are named volumes
#     backed by /home/halilalbayrak/data on the host via the `local`
#     driver with `o: bind`. Bind mounts directly in `volumes:` are not
#     used for those, per the subject.
#   * Passwords come from /run/secrets/* (docker secrets). The .env file
#     beside this compose is for non-secret config only.

name: inception

# ---- Services ---------------------------------------------------------------

services:

  mariadb:
    container_name: mariadb
    image: mariadb:42
    build:
      context: ./requirements/mariadb
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      # bash /dev/tcp probes that mariadbd is listening on 3306. We can't
      # use `mariadb-admin ping` here without burning the root password
      # into the healthcheck — by the time mariadbd binds the port it's
      # already finished its first-run bootstrap, so port-open is a
      # sufficient "ready" signal for depends_on.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/localhost/3306"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No `ports:` — mariadb is only reachable on the inception network.

  wordpress:
    container_name: wordpress
    image: wordpress:42
    build:
      context: ./requirements/wordpress
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wp_files:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    # No `ports:` — php-fpm:9000 is only reachable by nginx on the network.

  nginx:
    container_name: nginx
    image: nginx:42
    build:
      context: ./requirements/nginx
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    ports:
      - "443:443"
    volumes:
      # Read-only because nginx never needs to write into the WordPress
      # tree — php-fpm in the wordpress container does that.
      - wp_files:/var/www/html:ro
    networks:
      - inception
    depends_on:
      - wordpress

# ---- Network ----------------------------------------------------------------

networks:
  inception:
    name: inception
    driver: bridge

# ---- Volumes ----------------------------------------------------------------
# Required volumes (db_data, wp_files) live under /home/halilalbayrak/data
# via the `local` driver's bind option. The Makefile creates those host
# directories before `up`; compose itself won't mkdir for you when using
# this driver.

volumes:
  db_data:
    name: db_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/halilalbayrak/data/mariadb
  wp_files:
    name: wp_files
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/halilalbayrak/data/wordpress

# ---- Secrets ----------------------------------------------------------------

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
